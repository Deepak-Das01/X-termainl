name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (Release)
        # Exclude opt-in LiveIntegration tests that require private infrastructure.
        run: dotnet test --configuration Release --no-build --verbosity normal --filter "Category!=LiveIntegration&Category!=LocalConPtyInteractive&Category!=SerialLiveIntegration"

      # Optional binary artifact — not a GitHub Release. Disabled by default; enable when needed.
      # - name: Upload build
      #   uses: actions/upload-artifact@v4
      #   with:
      #     name: xterminal-release
      #     path: XTerminal.App/bin/Release/net8.0-windows/
